services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-32mb}
    mem_limit: ${POSTGRES_MEM_LIMIT:-160m}
    memswap_limit: ${POSTGRES_MEMSWAP_LIMIT:-160m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmp_vc_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-tmp_vc_bot}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF8 --locale=C}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-10}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-16MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-64MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-2MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-16MB}
      - -c
      - wal_buffers=${POSTGRES_WAL_BUFFERS:-1MB}
      - -c
      - autovacuum_max_workers=${POSTGRES_AUTOVACUUM_MAX_WORKERS:-1}
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tmp_vc_bot} -d ${POSTGRES_DB:-tmp_vc_bot}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    mem_limit: ${BOT_MEM_LIMIT:-192m}
    memswap_limit: ${BOT_MEMSWAP_LIMIT:-192m}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_REQUIRE_SSL: ${DATABASE_REQUIRE_SSL:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-1}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SYNC_GUILD_IDS: ${SYNC_GUILD_IDS:-}
      SYNC_GUILD_ID: ${SYNC_GUILD_ID:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_USER: ${POSTGRES_USER:-tmp_vc_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-tmp_vc_bot}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MALLOC_ARENA_MAX: "2"

  # Test database (isolated from production/development database)
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: tmp_vc_bot_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d tmp_vc_bot_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - dev

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@test-db:5432/tmp_vc_bot_test
      TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@test-db:5432/tmp_vc_bot_test
      TEST_DATABASE_URL_SYNC: postgresql://test_user:test_password@test-db:5432/tmp_vc_bot_test
      DISCORD_TOKEN: "test_token_for_testing"
    command: pytest -v --cov=src --cov-report=term-missing
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    profiles:
      - dev

  lint:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "ruff check src tests && ruff format --check src tests && mypy src"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    profiles:
      - dev

volumes:
  pgdata:
