services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-160m}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-96m}
    shm_size: ${POSTGRES_SHM_SIZE:-32mb}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmp_vc_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-tmp_vc_bot}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF8 --locale=C}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-10}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-16MB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    mem_limit: ${BOT_MEMORY_LIMIT:-192m}
    mem_reservation: ${BOT_MEMORY_RESERVATION:-128m}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_TOKENS: ${DISCORD_TOKENS:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_REQUIRE_SSL: ${DATABASE_REQUIRE_SSL:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-1}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SYNC_GUILD_IDS: ${SYNC_GUILD_IDS:-}
      SYNC_GUILD_ID: ${SYNC_GUILD_ID:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_USER: ${POSTGRES_USER:-tmp_vc_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-tmp_vc_bot}

volumes:
  pgdata:
