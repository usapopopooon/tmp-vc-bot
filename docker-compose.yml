services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tmp_vc_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tmp_vc_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/tmp_vc_bot
    command: sh -c "alembic upgrade head && python -m src.main"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic

  # Test database (isolated from development database)
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: tmp_vc_bot_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d tmp_vc_bot_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - dev

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@test-db:5432/tmp_vc_bot_test
      TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_password@test-db:5432/tmp_vc_bot_test
      TEST_DATABASE_URL_SYNC: postgresql://test_user:test_password@test-db:5432/tmp_vc_bot_test
      DISCORD_TOKEN: "test_token_for_testing"
    command: pytest -v --cov=src --cov-report=term-missing
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    profiles:
      - dev

  lint:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "ruff check src tests && ruff format --check src tests && mypy src"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    profiles:
      - dev

volumes:
  pgdata:
