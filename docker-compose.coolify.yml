services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 32mb
    mem_limit: 160m
    memswap_limit: 160m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmp_vc_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-tmp_vc_bot}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - max_connections=10
      - -c
      - shared_buffers=16MB
      - -c
      - effective_cache_size=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - wal_buffers=1MB
      - -c
      - autovacuum_max_workers=1
    volumes:
      - coolify_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tmp_vc_bot} -d ${POSTGRES_DB:-tmp_vc_bot}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    mem_limit: 192m
    memswap_limit: 192m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in Coolify}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tmp_vc_bot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tmp_vc_bot}
      DATABASE_REQUIRE_SSL: "false"
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "1"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SYNC_GUILD_IDS: ${SYNC_GUILD_IDS:-}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MALLOC_ARENA_MAX: "2"

volumes:
  coolify_pgdata:
